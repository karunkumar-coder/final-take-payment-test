
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Take | Payment Test</title>
<style>
body {
  margin: 0; min-height: 100vh; display: grid;
  place-items: center; padding: 20px;
  background: #101010; color: white;
  font-family: Arial, sans-serif;
}
.card {
  width: 100%; max-width: 400px; padding: 28px 22px;
  box-sizing: border-box; text-align: center;
  background: #1c1c1c; border: 1px solid #333;
  border-radius: 20px;
}
.logo { color: #ffd43b; font-size: 28px; font-weight: bold; }
.amount { font-size: 42px; font-weight: bold; margin: 20px; }
button, .pay {
  display: block; width: 100%; padding: 15px; margin-top: 12px;
  box-sizing: border-box; border: 0; border-radius: 10px;
  font-size: 16px; font-weight: bold; cursor: pointer;
  text-decoration: none;
}
button { background: #ffd43b; color: #111; }
.pay { background: #303030; color: white; }
.note { color: #bbb; font-size: 13px; line-height: 1.6; }
.upi { color: #ffd43b; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">FINAL TAKE</div>
  <h2>Payment Test</h2>
  <p>Sample registration payment</p>
  <div class="amount">₹10</div>

<a class="pay"
   href="phonepe://pay?pa=karunkumar.p08%40oksbi&amp;pn=Final%20Take&amp;am=10.00&amp;cu=INR&amp;tn=Final%20Take%20test%20registration">
  Pay ₹10
</a>

  <p class="note">
    TEST ONLY. Payment is not automatically verified.
    Do not treat this page as a confirmed registration.
  </p>
</main>

<script>
async function copyUPI() {
  const upi = "karunkumar.p08@oksbi";
  try {
    await navigator.clipboard.writeText(upi);
    document.getElementById("message").textContent =
      "UPI ID copied. Open your UPI app and paste it.";
  } catch {
    document.getElementById("message").textContent =
      "Copy this UPI ID manually: " + upi;
  }
}
</script>

</html>
