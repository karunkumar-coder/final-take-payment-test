
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>Final Take | Registration</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .logo span {
      color: #ffd43b;
    }

    .tagline {
      color: #999999;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 35px;
    }

    .card {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 28px 22px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .description {
      color: #b5b5b5;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .label {
      color: #999999;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .upi-box {
      background: #0b0b0b;
      border: 1px solid #393939;
      border-radius: 12px;
      padding: 18px 12px;
    }

    .upi-id {
      display: block;
      color: #ffd43b;
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
      margin-bottom: 18px;
    }

    .copy-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #ffd43b;
      color: #111111;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .copy-button:hover {
      background: #ffe16b;
    }

    .status {
      min-height: 18px;
      margin-top: 12px;
      color: #ffd43b;
      font-size: 12px;
    }

    .footer {
      margin-top: 25px;
      color: #777777;
      font-size: 12px;
    }

    .footer span {
      color: #ffd43b;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">FINAL <span>TAKE</span></div>
    <p class="tagline">EVERY STORY DESERVES A VOICE</p>

    <section class="card">
      <h1>Registration Payment</h1>

      <p class="description">
        Copy the UPI ID below to use it in your preferred UPI app.
      </p>

      <p class="label">FINAL TAKE UPI ID</p>

      <div class="upi-box">
        <span class="upi-id" id="upiId">9959129903@pthdfc</span>

        <button class="copy-button" id="copyButton" type="button">
          COPY UPI ID
        </button>

        <p class="status" id="status" aria-live="polite"></p>
      </div>
    </section>

    <footer class="footer">
      Made with creativity by <span>Final Take</span>
    </footer>

  </main>

  <script>
    const upiId = document.getElementById("upiId").textContent.trim();
    const copyButton = document.getElementById("copyButton");
    const status = document.getElementById("status");

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(upiId);
        copyButton.textContent = "COPIED!";
        status.textContent = "UPI ID copied successfully.";
      } catch (error) {
        window.prompt("Copy the UPI ID below:", upiId);
      }

      setTimeout(() => {
        copyButton.textContent = "COPY UPI ID";
        status.textContent = "";
      }, 2500);
    });
  </script>
</body>
</html>
