
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Take | Event Registration</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 20px;
    }

    .logo {
      color: #ffd43b;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    p { color: #d0d0d0; line-height: 1.6; }

    .amount {
      margin: 24px 0;
      font-size: 42px;
      font-weight: bold;
    }

    .pay-button {
      display: block;
      padding: 16px;
      border-radius: 12px;
      background: #ffd43b;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #aaa;
    }

    .upi-id {
      overflow-wrap: anywhere;
      color: #ffd43b;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">FINAL TAKE</div>
    <h2>Event Registration</h2>
    <p>Test the payment link for our upcoming café event.</p>

    <div class="amount">₹10</div>

    <a class="pay-button"
       href="upi://pay?pa=karunkumar.p08@oksbi&amp;pn=Final%20Take&amp;am=10.00&amp;cu=INR&amp;tn=Final%20Take%20test%20registration">
      Pay ₹10
    </a>

    <p class="note">
      TEST ONLY — not official event registration.
      Your UPI app should open when you tap the button.
      Confirm the recipient and amount before paying.
    </p>

    <p class="note">
      UPI ID: <span class="upi-id">karunkumar.p08@oksbi</span>
    </p>
  </main>
</body>
</html>
